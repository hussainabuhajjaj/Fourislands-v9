services:
  app:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini:ro
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug-override.ini:ro
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    volumes:
      - .:/var/www/html

  mailpit:
    image: axllent/mailpit:latest
    container_name: fourislands-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - fourislands
