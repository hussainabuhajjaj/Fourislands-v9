services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fourislands-app:latest
    container_name: fourislands-app
    restart: unless-stopped
    working_dir: /var/www/html
    networks:
      - fourislands
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-fourislands}
      - DB_USERNAME=${DB_USERNAME:-fourislands}
      - DB_PASSWORD=${DB_PASSWORD:-secret}

  web:
    image: nginx:1.27-alpine
    container_name: fourislands-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks:
      - fourislands
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: fourislands-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootsecret}
      - MYSQL_DATABASE=${DB_DATABASE:-fourislands}
      - MYSQL_USER=${DB_USERNAME:-fourislands}
      - MYSQL_PASSWORD=${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - fourislands
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:

networks:
  fourislands:
    driver: bridge
